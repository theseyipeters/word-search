<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guidde Play — Bible Games</title>
    <style>
      @font-face {
        font-family: "Oxygen";
        src: url("/social/Oxygen-Bold.woff2") format("woff2");
        font-style: normal;
        font-weight: 700;
        font-display: block;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 1080px;
        height: 1350px;
        margin: 0;
        overflow: hidden;
        background: #f6f7f4;
      }

      body {
        color: #171717;
        font-family: "Oxygen", sans-serif;
      }

      .flyer {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #f6f7f4;
      }

      .artwork {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .wash {
        position: absolute;
        inset: 0 0 auto;
        height: 650px;
        background: linear-gradient(
          180deg,
          rgba(246, 247, 244, 0.99) 0%,
          rgba(246, 247, 244, 0.97) 72%,
          rgba(246, 247, 244, 0) 100%
        );
      }

      header {
        position: absolute;
        z-index: 2;
        top: 62px;
        left: 72px;
        right: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        width: 168px;
        height: auto;
        display: block;
      }

      .play-now {
        min-height: 54px;
        padding: 0 24px;
        display: inline-flex;
        align-items: center;
        gap: 17px;
        border-radius: 999px;
        background: #171717;
        color: #fff;
        font-size: 16px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .play-now span {
        width: 26px;
        height: 26px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #dfff65;
        color: #171717;
        font-size: 16px;
      }

      .copy {
        position: absolute;
        z-index: 2;
        top: 164px;
        left: 72px;
        right: 72px;
      }

      .kicker {
        margin: 0 0 22px;
        color: #62665f;
        font-size: 15px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 920px;
        margin: 0;
        font-size: 78px;
        line-height: 0.98;
        letter-spacing: -0.058em;
      }

      h1 span {
        width: fit-content;
        margin: 10px 0 9px -12px;
        padding: 4px 14px 10px;
        display: block;
        border-radius: 23px;
        background: #dfff65;
        transform: rotate(-1deg);
      }

      .support {
        max-width: 620px;
        margin: 24px 0 0;
        color: #5f625c;
        font-size: 21px;
        line-height: 1.38;
        letter-spacing: -0.02em;
      }

      .game-strip {
        position: absolute;
        z-index: 3;
        left: 50%;
        bottom: 43px;
        width: calc(100% - 112px);
        min-height: 84px;
        padding: 13px 15px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        border: 1px solid rgba(23, 23, 23, 0.1);
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 24px 60px rgba(23, 23, 23, 0.16);
        transform: translateX(-50%);
        backdrop-filter: blur(16px);
      }

      .game-strip div {
        min-height: 58px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 17px;
        font-size: 14px;
        letter-spacing: -0.02em;
        text-align: center;
      }

      .game-strip div:nth-child(1) { background: #ffd6bc; }
      .game-strip div:nth-child(2) { background: #cdeafa; }
      .game-strip div:nth-child(3) { background: #dfff65; }
      .game-strip div:nth-child(4) { background: #171717; color: #fff; }
    </style>
  </head>
  <body>
    <main class="flyer">
      <img
        class="artwork"
        src="/social/guidde-play-flyer-background.png"
        alt=""
      />
      <div class="wash"></div>

      <header>
        <img class="logo" src="/guidde3.svg" alt="Guidde" />
        <div class="play-now">Play now <span><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" aria-hidden="true"><path d="M4 12h16m0 0-6-6m6 6-6 6" /></svg></span></div>
      </header>

      <section class="copy">
        <p class="kicker">Play · connect · grow</p>
        <h1>
          You can now play
          <span>Bible games</span>
          on Guidde Play.
        </h1>
        <p class="support">
          Pick a game, invite your people, and enjoy the Word together.
        </p>
      </section>

      <section class="game-strip" aria-label="Available games">
        <div>Word Search</div>
        <div>Tic Tac Toe</div>
        <div>Memory Match</div>
        <div>Trivia Battle</div>
      </section>
    </main>
  </body>
</html>
